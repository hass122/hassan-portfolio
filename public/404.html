<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Hassan Raza</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #F7F5EF; --ink: #24251F; --muted: #77766E; --accent: #68765B; --line: #E4E0D6; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #211F1C; --ink: #F0EDE5; --muted: #AAA69B; --accent: #B69A70; --line: #454138; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; }
      main { max-width: 32rem; }
      .code { font-family: ui-monospace, 'IBM Plex Mono', monospace; font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0; }
      h1 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: clamp(2.25rem, 8vw, 3.5rem); line-height: 1.05; margin: 1rem 0 0; }
      p { color: var(--muted); line-height: 1.6; margin: 1rem 0 0; }
      a { display: inline-block; margin-top: 1.75rem; padding: 0.75rem 1.5rem; min-height: 44px; border: 1px solid var(--accent); border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 500; }
      a:hover, a:focus-visible { background: var(--accent); color: var(--bg); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be broken or the page may have moved. The portfolio home page has everything.</p>
      <a href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
